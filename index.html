<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Enemies</title>
<meta name="theme-color" content="#2b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2f4f;color:#f4e9c9;font-family:monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #game{position:fixed;inset:0;touch-action:none;}
  #game canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  #topbar{position:fixed;left:0;right:0;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:rgba(43,29,58,.92);border-bottom:3px solid #120c18;}
  #topbar h1{font-size:15px;margin:0 6px 0 0;letter-spacing:1px;text-shadow:2px 2px 0 #000;white-space:nowrap;}
  button,select{font:inherit;font-size:13px;color:#f4e9c9;background:#4a3563;border:2px solid #120c18;
    border-radius:0;padding:5px 7px;box-shadow:inset -2px -2px 0 #2e2140,inset 2px 2px 0 #6a5090;}
  button:active{box-shadow:inset 2px 2px 0 #2e2140;}
  button.on{background:#8a5a1e;box-shadow:inset -2px -2px 0 #5a3a12,inset 2px 2px 0 #b07a32;}
  #bottombar{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:rgba(43,29,58,.92);border-top:3px solid #120c18;font-size:13px;}
  #bottombar{flex-wrap:wrap;row-gap:5px;}
  #info{flex-basis:100%;order:3;min-width:0;line-height:1.35;}
  #turn{padding:4px 8px;border:2px solid #120c18;font-weight:bold;text-shadow:none;white-space:nowrap;}
  #spacer{flex:1;}
  #end{background:#2f7a3a;box-shadow:inset -2px -2px 0 #1d4f25,inset 2px 2px 0 #4fa85c;font-weight:bold;}
  #overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:#1a1224;padding:20px;}
  #overlay[hidden]{display:none;}
  #overlay.see-through{background:rgba(26,18,36,.78);}
  #ov-box{max-width:340px;width:100%;text-align:center;background:#2b1d3a;border:3px solid #120c18;
    box-shadow:inset -3px -3px 0 #1d1428,inset 3px 3px 0 #4a3563;padding:22px 18px;}
  #ov-title{font-size:24px;margin:0 0 12px;text-shadow:2px 2px 0 #000;}
  #ov-text{font-size:14px;margin:0 0 18px;line-height:1.4;}
  #ov-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  #ov-cancel{font-size:15px;padding:10px 14px;}
  #ov-input{font:inherit;font-size:18px;text-transform:uppercase;text-align:center;width:100%;margin:0 0 16px;padding:8px;
    color:#f4e9c9;background:#1a1224;border:2px solid #120c18;box-shadow:inset 2px 2px 0 #000;}
  #ov-btn{font-size:16px;padding:10px 16px;color:#fff;text-shadow:1px 1px 0 #000;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.3);}
  @media (max-width:560px){#topbar h1{display:none;} button,select{font-size:12px;padding:4px 5px;}}
  #code{white-space:nowrap;}
  .res{padding:3px 6px;border:2px solid #120c18;font-weight:bold;white-space:nowrap;}
  #gold{background:#6b5314;color:#ffe48a;}
  #food{background:#4d3a1c;color:#ffc89a;}
  #actions{flex-basis:100%;order:4;display:flex;flex-wrap:wrap;gap:6px;}
  #actions[hidden]{display:none;}
  #actions button{font-size:13px;padding:7px 9px;}
  #actions button.main{background:#2f7a3a;box-shadow:inset -2px -2px 0 #1d4f25,inset 2px 2px 0 #4fa85c;font-weight:bold;}
  #actions button:disabled{opacity:.45;}
  /* Partidas online */
  #net-btn{background:#2f5a8a;box-shadow:inset -2px -2px 0 #1d3a5a,inset 2px 2px 0 #4f7ab0;}
  body.online-game #new,body.online-game #size,body.online-game #type,body.online-game #abundance,
  body.online-game #armies,body.online-game #fog,body.online-game #code{display:none;}
  #end:disabled{opacity:.45;}
  #net{position:fixed;inset:0;z-index:20;overflow-y:auto;background:#1a1224;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;}
  #net[hidden]{display:none;}
  #net-box{max-width:380px;margin:0 auto;background:#2b1d3a;border:3px solid #120c18;
    box-shadow:inset -3px -3px 0 #1d1428,inset 3px 3px 0 #4a3563;padding:18px 16px;}
  #net h2{font-size:22px;margin:0 0 12px;text-align:center;text-shadow:2px 2px 0 #000;}
  #net p{font-size:14px;line-height:1.4;margin:0 0 12px;}
  #net .small{font-size:12px;opacity:.85;}
  #net a{color:#ffe48a;}
  #net .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  #net .row button{font-size:15px;padding:9px 12px;}
  #net button.main{background:#2f7a3a;box-shadow:inset -2px -2px 0 #1d4f25,inset 2px 2px 0 #4fa85c;font-weight:bold;}
  #net button:disabled{opacity:.45;}
  #net input{font:inherit;font-size:18px;text-align:center;width:100%;box-sizing:border-box;margin:0 0 6px;padding:8px;text-transform:none;
    color:#f4e9c9;background:#1a1224;border:2px solid #120c18;box-shadow:inset 2px 2px 0 #000;}
  #net-code{text-transform:uppercase !important;letter-spacing:4px;}
  #net label{display:block;font-size:13px;margin:0 0 10px;}
  #net label select{display:block;width:100%;margin-top:3px;font-size:15px;padding:6px;}
  #net .code{font-size:34px;letter-spacing:8px;text-align:center;font-weight:bold;color:#ffe48a;text-shadow:2px 2px 0 #000;margin:0 0 6px;}
  #net .seats{list-style:none;padding:0;margin:0 0 12px;font-size:14px;}
  #net .seats li{padding:5px 0;border-bottom:1px solid #3a2a4c;}
  #net .dot{display:inline-block;width:12px;height:12px;border:2px solid #120c18;margin-right:6px;vertical-align:middle;flex:none;}
  #net button.game{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin:0 0 6px;padding:8px;font-size:14px;}
  #net .yours{color:#7dff8a;}
  #net-skip{position:fixed;z-index:9;right:10px;top:calc(56px + env(safe-area-inset-top));font-size:14px;padding:8px 10px;}
  #net-skip[hidden]{display:none;}
  #net-toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
    background:#120c18;border:2px solid #f4e9c9;padding:8px 12px;font-size:13px;max-width:85vw;text-align:center;}
  #net-toast[hidden]{display:none;}
  /* Tecnologías */
  #techs{background:#2f5a6a;box-shadow:inset -2px -2px 0 #1d3a45,inset 2px 2px 0 #4f8a9a;font-weight:bold;}
  #tech{position:fixed;inset:0;z-index:15;overflow-y:auto;background:rgba(26,18,36,.96);padding:calc(12px + env(safe-area-inset-top)) 10px 20px;}
  #tech[hidden]{display:none;}
  #tech-box{max-width:520px;margin:0 auto;}
  #tech h2{font-size:20px;margin:0 0 4px;text-align:center;text-shadow:2px 2px 0 #000;}
  #tech .small{font-size:12px;opacity:.85;text-align:center;margin:0 0 10px;}
  .tb{margin:0 0 10px;}
  #tech-detail ul.td{margin:6px 0;padding-left:18px;font-size:13px;line-height:1.4;}
  #tech-detail ul.td li{margin:0 0 4px;}
  .tb h3{font-size:13px;margin:0 0 4px;letter-spacing:1px;}
  .tb .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .tc{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-height:62px;padding:5px;font-size:11px;line-height:1.2;
    background:#3a2a4c;opacity:.6;}
  .tc b{font-size:12px;}
  .tc .st{margin-top:auto;font-size:11px;}
  .tc.have{background:#2f6a3a;opacity:1;box-shadow:inset -2px -2px 0 #1d4f25,inset 2px 2px 0 #4fa85c;}
  .tc.can{background:#7a5a1a;opacity:1;box-shadow:inset -2px -2px 0 #4a3510,inset 2px 2px 0 #b08a3a;}
  .tc.poor{opacity:.85;}
  .tc.sel{outline:3px solid #fff6c8;outline-offset:-1px;}
  #tech-detail{position:sticky;bottom:0;background:#2b1d3a;border:3px solid #120c18;padding:10px;font-size:13px;line-height:1.4;margin-top:6px;}
  #tech-detail .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;}
  #tech-detail button{font-size:14px;padding:8px 12px;}
  #tech-detail button.main{background:#2f7a3a;box-shadow:inset -2px -2px 0 #1d4f25,inset 2px 2px 0 #4fa85c;font-weight:bold;}
</style>
</head>
<body>
<div id="game"></div>
<div id="topbar">
  <h1>Pixel Enemies</h1>
  <button id="new">Nueva partida</button>
  <select id="size" aria-label="Tamaño"></select>
  <select id="type" aria-label="Tipo de mapa"></select>
  <select id="abundance" aria-label="Recursos"></select>
  <select id="armies" aria-label="Dónde empiezan los ejércitos"></select>
  <button id="fog">Niebla</button>
  <button id="net-btn">Online</button>
</div>
<button id="net-skip" hidden>Saltar repetición ▶▶</button>
<div id="net" hidden></div>
<div id="net-toast" hidden></div>
<div id="bottombar">
  <span id="turn">Ronda 1</span>
  <span id="gold" class="res">Oro 0</span>
  <span id="food" class="res">Comida 0</span>
  <button id="techs">Tecnologías</button>
  <span id="spacer"></span>
  <button id="code" title="Código del mapa">------</button>
  <button id="end">Pasar turno</button>
  <span id="info"></span>
  <div id="actions" hidden></div>
</div>
<div id="tech" hidden><div id="tech-box"></div></div>
<div id="overlay" hidden>
  <div id="ov-box">
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <input id="ov-input" maxlength="12" autocomplete="off" hidden>
    <div id="ov-buttons"><button id="ov-cancel" hidden></button><button id="ov-btn"></button></div>
  </div>
</div>
<script src="lib/phaser.min.js"></script>
<script src="src/map.js"></script>
<script src="src/tiles.js"></script>
<script src="src/units.js"></script>
<script src="src/rules.js"></script>
<script src="src/game.js"></script>
<script src="src/online-config.js"></script>
<script src="src/online.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
