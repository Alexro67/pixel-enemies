<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Enemies</title>
<meta name="theme-color" content="#2b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2f4f;color:#f4e9c9;font-family:monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #game{position:fixed;inset:0;touch-action:none;}
  #game canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  #topbar{position:fixed;left:0;right:0;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:rgba(43,29,58,.92);border-bottom:3px solid #120c18;}
  #topbar h1{font-size:15px;margin:0 6px 0 0;letter-spacing:1px;text-shadow:2px 2px 0 #000;white-space:nowrap;}
  button,select{font:inherit;font-size:13px;color:#f4e9c9;background:#4a3563;border:2px solid #120c18;
    border-radius:0;padding:5px 7px;box-shadow:inset -2px -2px 0 #2e2140,inset 2px 2px 0 #6a5090;}
  button:active{box-shadow:inset 2px 2px 0 #2e2140;}
  button.on{background:#8a5a1e;box-shadow:inset -2px -2px 0 #5a3a12,inset 2px 2px 0 #b07a32;}
  #bottombar{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:rgba(43,29,58,.92);border-top:3px solid #120c18;font-size:13px;}
  #info{flex:1;min-width:0;}
  @media (max-width:560px){#topbar h1{display:none;} button,select{font-size:12px;padding:4px 5px;}}
  #code{white-space:nowrap;}
</style>
</head>
<body>
<div id="game"></div>
<div id="topbar">
  <h1>Pixel Enemies</h1>
  <button id="new">Nuevo mapa</button>
  <select id="size" aria-label="Tamaño"></select>
  <select id="type" aria-label="Tipo de mapa"></select>
  <select id="abundance" aria-label="Recursos"></select>
  <button id="fog">Niebla</button>
</div>
<div id="bottombar">
  <span id="info"></span>
  <button id="code" title="Código del mapa">------</button>
</div>
<script src="lib/phaser.min.js"></script>
<script src="src/map.js"></script>
<script src="src/tiles.js"></script>
<script src="src/game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
