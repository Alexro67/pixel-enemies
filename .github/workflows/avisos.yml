# Cada 5 minutos (más o menos: GitHub a veces se retrasa) mira las partidas online:
# pasa el turno a quien se le acabó el tiempo y avisa al móvil de a quién le toca.
name: Avisos de turno
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency: avisos
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node servidor/avisos.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
